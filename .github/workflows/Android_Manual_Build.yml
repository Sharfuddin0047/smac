name: Android Manual Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build SMAC Android App
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17
      # Required by the Android SDK command-line tools
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 6. Check Java
      - name: Check Java version
        run: java -version

      # 7. Check Gradle
      - name: Check Gradle version
        run: ./gradlew --version

      # 8. Decode Android keystore
      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      # 9. Create local.properties for release signing
      - name: Create local.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      # 10. Build signed release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 11. Upload APK
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SMAC-Android-Release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
