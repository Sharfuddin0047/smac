name: Android Manual Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SMAC Android App
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Make Gradle executable
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 6. Check Java
      - name: Check Java version
        run: java -version

      # 7. Check Gradle
      - name: Check Gradle version
        run: ./gradlew --version

      # 8. Calculate Version
      - name: Calculate Version
        id: version
        run: |
          RUN_NUMBER=${{ github.run_number }}
          INDEX=$((RUN_NUMBER - 1))

          PATCH=$((INDEX % 10))
          VERSION_GROUP=$((INDEX / 10))

          MAJOR=$((1 + VERSION_GROUP / 5))
          MINOR=$(( (VERSION_GROUP % 5) * 2 ))

          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Version Code: $RUN_NUMBER"
          echo "Version Name: $VERSION_NAME"

      # 9. Version Bump
      - name: Version Bump
        uses: chkfung/android-version-actions@v1.2.2
        with:
          gradlePath: app/build.gradle.kts
          versionCode: ${{ github.run_number }}
          versionName: ${{ steps.version.outputs.version_name }}

      # 10. Decode Android keystore
      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      # 11. Create local.properties for release signing
      - name: Create local.properties
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > local.properties <<EOF
          RELEASE_STORE_FILE=release.keystore
          RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF

      # 12. Build signed release APK
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 13. Rename APK
      - name: Rename APK
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          cp app/build/outputs/apk/release/*.apk "SalesEdgeAI-v${VERSION_NAME}.apk"

      # 14. Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_name }}
          name: SalesEdgeAI v${{ steps.version.outputs.version_name }}
          files: |
            SalesEdgeAI-v${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
